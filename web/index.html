    <div><a href="https://kosis.kr/" target="_blank" rel="noopener noreferrer">KOSIS ↗</a><button type="button" id="footer-info">서비스 안내</button></div>

    <h2 id="info-title">Prism</h2>
    <p>기사 속 통계자료를 선택하고 관련된 주장과 상반된 주장을 비교하는 포털이에요. 수집한 기사 전체를 탐색하고, 자료 연결 근거가 있는 기사만 따로 볼 수도 있어요.</p>
    <p>비교할 다른 기사가 있는 자료명을 누르면 같은 자료를 사용한 기사들의 주장이 표시돼요.</p>
    <p>비교 화면에서는 양쪽 기사의 발췌문과 맥락을 살펴보고, 기사 원문과 통계자료도 확인할 수 있어요.</p>
  </dialog>
  <dialog id="comparison-dialog" class="comparison-dialog" aria-labelledby="comparison-title">
